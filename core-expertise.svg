<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Core expertise: Backend Architecture, REST API Development, Fullstack Web Applications, Database Optimization, AI and Computer Vision Systems, Production-Ready Engineering, Scalable Backend Infrastructure, Clean Architecture Pattern">
  <title>Core Expertise — Model Training</title>
  <defs>
