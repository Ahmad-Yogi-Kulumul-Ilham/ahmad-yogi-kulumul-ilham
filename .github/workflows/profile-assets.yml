name: Generate Profile Assets

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches: [main]
    paths:
      - .github/workflows/profile-assets.yml
      - .github/scripts/**

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Ahmad-Yogi-Kulumul-Ilham

      - name: Generate github-analytics.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/github_analytics.py Ahmad-Yogi-Kulumul-Ilham dist/github-analytics.svg

      - name: Push to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: dist
