<svg width="1200" height="460" viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Backend API development features: JWT Authentication, Clean Architecture, Modular Structure, API Integration, Database Optimization, Production Workflow, Scalable System Design, Dockerized Environment">
  <title>Backend API Development — Request Flow</title>
  <defs>
    <linearGradient id="bbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d1f"/>
      <stop offset="55%" stop-color="#0d1a3a"/>
      <stop offset="100%" stop-color="#080c1c"/>
    </linearGradient>
    <pattern id="bgrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#3b82f6" stroke-opacity="0.07"/>
    </pattern>
    <filter id="bglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="460" rx="16" fill="url(#bbg)"/>
  <rect width="1200" height="460" rx="16" fill="url(#bgrid)"/>

  <path d="M16 0 H1184 A16 16 0 0 1 1200 16 V44 H0 V16 A16 16 0 0 1 16 0 Z" fill="#3b82f6" fill-opacity="0.12"/>
  <circle cx="28" cy="22" r="6" fill="#ff5f56"/><circle cx="48" cy="22" r="6" fill="#ffbd2e"/><circle cx="68" cy="22" r="6" fill="#27c93f"/>
  <text x="600" y="27" text-anchor="middle" font-family="monospace" font-size="13" fill="#93a8d6">api-client — GET /api/v1/features</text>

  <!-- Request / response -->
  <g font-family="monospace" font-size="16">
    <text x="44" y="82" fill="#e6e9f5"><tspan fill="#00ffaa">$</tspan> curl -s localhost:8000/api/v1/features</text>
    <text x="44" y="110"><tspan fill="#00ffaa" font-weight="bold">HTTP/1.1 200 OK</tspan><tspan fill="#93a8d6"> · application/json · auth: Bearer JWT</tspan></text>
    <g fill="#93a8d6">
      <text x="44" y="148">{</text>
      <text x="68" y="173"><tspan fill="#7dd3fc">"features"</tspan>: [</text>
      <g fill="#00ffaa">
        <text x="92" y="198">"JWT Authentication",</text>
        <text x="92" y="223">"Clean Architecture",</text>
        <text x="92" y="248">"Modular Structure",</text>
        <text x="92" y="273">"API Integration",</text>
        <text x="92" y="298">"Database Optimization",</text>
        <text x="92" y="323">"Production Workflow",</text>
        <text x="92" y="348">"Scalable System Design",</text>
        <text x="92" y="373">"Dockerized Environment"</text>
      </g>
      <text x="68" y="398">]</text>
      <text x="44" y="423">}</text>
    </g>
  </g>

  <line x1="720" y1="64" x2="720" y2="430" stroke="#3b82f6" stroke-opacity="0.18" stroke-dasharray="4 6"/>

  <!-- Architecture flow -->
  <rect x="790" y="152" width="300" height="290" rx="14" fill="#3b82f6" fill-opacity="0.04" stroke="#60a5fa" stroke-opacity="0.45" stroke-dasharray="6 5"/>
  <text x="1080" y="172" text-anchor="end" font-family="monospace" font-size="11" fill="#60a5fa">docker network</text>

  <g stroke-width="2">
    <line x1="925" y1="122" x2="925" y2="370" stroke="#22d3ee" stroke-opacity="0.35"/>
    <line x1="955" y1="122" x2="955" y2="370" stroke="#00ffaa" stroke-opacity="0.35"/>
  </g>
  <g filter="url(#bglow)">
    <circle cx="925" cy="122" r="5" fill="#22d3ee"><animate attributeName="cy" values="122;370" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="955" cy="370" r="5" fill="#00ffaa"><animate attributeName="cy" values="370;122" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="monospace">
    <g fill="#0b1430" stroke-width="1.5">
      <rect x="810" y="70" width="260" height="52" rx="10" stroke="#93a8d6"/>
      <rect x="810" y="185" width="260" height="52" rx="10" stroke="#22d3ee"/>
      <rect x="810" y="275" width="260" height="52" rx="10" stroke="#a78bfa"/>
      <rect x="810" y="370" width="260" height="52" rx="10" stroke="#00ffaa"/>
    </g>
    <g text-anchor="middle">
      <text x="940" y="93" font-size="15" font-weight="bold" fill="#e6e9f5">CLIENT</text>
      <text x="940" y="112" font-size="11" fill="#93a8d6">web · mobile · dashboard</text>
      <text x="940" y="208" font-size="15" font-weight="bold" fill="#22d3ee">API GATEWAY</text>
      <text x="940" y="227" font-size="11" fill="#93a8d6">JWT auth · validation</text>
      <text x="940" y="298" font-size="15" font-weight="bold" fill="#a78bfa">SERVICE LAYER</text>
      <text x="940" y="317" font-size="11" fill="#93a8d6">clean architecture · modules</text>
      <text x="940" y="393" font-size="15" font-weight="bold" fill="#00ffaa">DATABASE</text>
      <text x="940" y="412" font-size="11" fill="#93a8d6">optimized queries · indexes</text>
    </g>
    <text x="915" y="142" text-anchor="end" font-size="11" fill="#22d3ee">request ↓</text>
    <text x="965" y="142" font-size="11" fill="#00ffaa">↑ response</text>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="459" rx="16" fill="none" stroke="#3b82f6" stroke-opacity="0.25"/>
</svg>
