<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Active projects: Smart POS System, AI Automation Dashboard, REST API Backend Services, YOLO Computer Vision Research, Fullstack Admin Dashboard, Inventory and Warehouse Systems, AI Integration Projects">
