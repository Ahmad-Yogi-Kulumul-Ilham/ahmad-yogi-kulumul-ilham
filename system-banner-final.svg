<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ahmad Yogi Kulumul Ilham — Fullstack Developer, AI Automation Engineer, Computer Vision Researcher">
  <title>Ahmad Yogi Kulumul Ilham — System Banner</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="48%" stop-color="#211d49"/>
      <stop offset="100%" stop-color="#161a31"/>
    </linearGradient>

    <radialGradient id="halo" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#00ffaa" stop-opacity="0.13"/>
      <stop offset="55%" stop-color="#00ffaa" stop-opacity="0.035"/>
      <stop offset="100%" stop-color="#00ffaa" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#00ffaa" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <clipPath id="clip">
      <rect x="0" y="0" width="1200" height="300" rx="20"/>
    </clipPath>
  </defs>

  <!-- Main background -->
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#grid)"/>
  <ellipse cx="600" cy="145" rx="470" ry="135" fill="url(#halo)"/>

  <!-- Soft central glow -->
  <ellipse cx="600" cy="148" rx="330" ry="62" fill="#00ffaa" opacity="0.035" filter="url(#softGlow)"/>

  <!-- Circuit traces: left -->
  <g fill="none" stroke="#00ffaa" stroke-width="2" opacity="0.32">
    <path d="M40 74 H145 V105 H220"/>
    <path d="M25 126 H105 V162 H175 V180 H250"/>
    <path d="M55 224 H140 V204 H205"/>
    <path d="M92 260 H195 V235 H285"/>
    <path d="M125 36 V62 H245 V82"/>
  </g>

  <!-- Circuit traces: right -->
  <g fill="none" stroke="#00ffaa" stroke-width="2" opacity="0.32">
    <path d="M1160 74 H1055 V105 H980"/>
    <path d="M1175 126 H1095 V162 H1025 V180 H950"/>
    <path d="M1145 224 H1060 V204 H995"/>
    <path d="M1108 260 H1005 V235 H915"/>
    <path d="M1075 36 V62 H955 V82"/>
  </g>

  <!-- Circuit nodes -->
  <g fill="#00ffaa" opacity="0.8" filter="url(#glow)">
    <circle cx="40" cy="74" r="3"/><circle cx="220" cy="105" r="3"/>
    <circle cx="25" cy="126" r="3"/><circle cx="250" cy="180" r="3"/>
    <circle cx="55" cy="224" r="3"/><circle cx="285" cy="235" r="3"/>
    <circle cx="125" cy="36" r="3"/><circle cx="245" cy="82" r="3"/>
    <circle cx="1160" cy="74" r="3"/><circle cx="980" cy="105" r="3"/>
    <circle cx="1175" cy="126" r="3"/><circle cx="950" cy="180" r="3"/>
    <circle cx="1145" cy="224" r="3"/><circle cx="915" cy="235" r="3"/>
    <circle cx="1075" cy="36" r="3"/><circle cx="955" cy="82" r="3"/>
  </g>

  <!-- Floating particles -->
  <g fill="#00ffaa" filter="url(#glow)">
    <circle cx="174" cy="55" r="1.8" opacity="0.75">
      <animate attributeName="cy" values="55;47;55" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.9;0.25" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="310" cy="48" r="1.5" opacity="0.7">
      <animate attributeName="cy" values="48;58;48" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="455" cy="72" r="1.7" opacity="0.55">
      <animate attributeName="cy" values="72;64;72" dur="3.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="63" r="1.6" opacity="0.65">
      <animate attributeName="cy" values="63;55;63" dur="4.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="887" cy="49" r="1.8" opacity="0.7">
      <animate attributeName="cy" values="49;59;49" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="56" r="1.5" opacity="0.6">
      <animate attributeName="cy" values="56;47;56" dur="3.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="245" r="1.8" opacity="0.6">
      <animate attributeName="cy" values="245;236;245" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="254" r="1.4" opacity="0.6">
      <animate attributeName="cy" values="254;246;254" dur="4.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="248" r="1.7" opacity="0.65">
      <animate attributeName="cy" values="248;257;248" dur="5.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="256" r="1.6" opacity="0.6">
      <animate attributeName="cy" values="256;247;256" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Faint binary / technical texture -->
  <g clip-path="url(#clip)" fill="#00ffaa" font-family="monospace" font-size="13" opacity="0.10">
    <text x="42" y="108">010101 110010 001101</text>
    <text x="42" y="143">API  REST  HTTP  JSON</text>
    <text x="42" y="178">101001 011010 110101</text>
    <text x="965" y="108">010010 101101 001011</text>
    <text x="932" y="143">AI  CV  YOLO  MODEL</text>
    <text x="962" y="178">110100 010111 101001</text>
    <text x="160" y="264">DOCKER // LINUX // GIT</text>
    <text x="1040" y="264" text-anchor="end">PYTHON // LARAVEL // REACT</text>
  </g>

  <!-- Center scanning line -->
  <rect x="285" y="132" width="630" height="2" rx="1" fill="#00ffaa" opacity="0.10">
    <animate attributeName="y" values="116;190;116" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Animated role text -->
  <g text-anchor="middle" font-family="monospace" font-size="34" font-weight="bold" fill="#00ffaa" filter="url(#glow)">
    <text x="600" y="160" opacity="0">FULLSTACK DEVELOPER<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.08;0.26;0.34;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="600" y="160" opacity="0">AI AUTOMATION ENGINEER<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.34;0.42;0.60;0.68;1" dur="12s" repeatCount="indefinite"/></text>
    <text x="600" y="160" opacity="0">COMPUTER VISION RESEARCHER<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.68;0.76;0.92;0.98;1" dur="12s" repeatCount="indefinite"/></text>
  </g>

  <!-- Minimal decorative bars -->
  <g fill="#00ffaa" opacity="0.55">
    <rect x="72" y="276" width="48" height="3" rx="1.5"/>
    <rect x="128" y="276" width="18" height="3" rx="1.5" opacity="0.45"/>
    <rect x="1054" y="276" width="18" height="3" rx="1.5" opacity="0.45"/>
    <rect x="1080" y="276" width="48" height="3" rx="1.5"/>
  </g>

  <!-- Bottom wave -->
  <path d="M0 270 Q150 238 300 270 T600 270 T900 270 T1200 270 V300 H0 Z"
        fill="#ffffff" opacity="0.055"/>

  <!-- Border -->
  <rect x="8" y="8" width="1184" height="284" rx="16"
        fill="none" stroke="#00ffaa" stroke-opacity="0.15"/>
</svg>
